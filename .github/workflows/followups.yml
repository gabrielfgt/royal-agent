name: Follow-up automático

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Chamar job de follow-up
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/jobs/followups"
